<!DOCTYPE html>
<html>
<head>
    <title>Live Messages</title>
    <style>
        .message-box {
            margin: 10px 0;
            padding: 10px;
            color: #000;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .timestamp {
            font-weight: bold;
            margin-right: 8px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="messages"></div>

    <script>
        async function loadMessages() {
            const response = await fetch("/get_messages/");
            const data = await response.json();
            const container = document.getElementById("messages");
            container.innerHTML = '';

            data.messages.forEach(msg => {
                const box = document.createElement("div");
                box.className = "message-box";
                box.style.backgroundColor = msg.background_color;

                const timestamp = new Date(msg.timestamp).toLocaleString();

                box.innerHTML = `<span class="timestamp">${timestamp}</span>${msg.text}`;
                container.appendChild(box);
            });
        }

        setInterval(loadMessages, 5000);  // Poll every 5 second
        loadMessages();  // Load once at start
    </script>
</body>
</html>
